<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112E"/>
      <stop offset="1" stop-color="#2A1F55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#FF8C7A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF8C7A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2470"/>
      <stop offset="0.5" stop-color="#E2557A"/>
      <stop offset="0.62" stop-color="#FFB36B"/>
      <stop offset="0.63" stop-color="#21C2C9"/>
      <stop offset="1" stop-color="#0A4D7A"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AA8F0"/>
      <stop offset="0.55" stop-color="#3E5F98"/>
      <stop offset="1" stop-color="#14506E"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A4C"/>
      <stop offset="0.5" stop-color="#F2A65A"/>
      <stop offset="1" stop-color="#8C3D1E"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050B24"/>
      <stop offset="0.45" stop-color="#2AD1A0"/>
      <stop offset="0.7" stop-color="#2A3F6E"/>
      <stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="screen"><rect x="790" y="96" width="276" height="500" rx="38"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Title and description -->
  <text x="84" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#FFFFFF" letter-spacing="-1">CarouselKit</text>
  <text x="86" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#C9C3E8">Snapping paging carousels for SwiftUI</text>
  <text x="86" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#C9C3E8">on iPhone and Apple TV</text>

  <!-- Feature chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">
    <rect x="84" y="346" width="170" height="42" rx="21" fill="#FF8C7A" fill-opacity="0.22" stroke="#FF8C7A" stroke-opacity="0.6"/>
    <text x="169" y="373" text-anchor="middle">Peeking cards</text>
    <rect x="266" y="346" width="201" height="42" rx="21" fill="#7FB6FF" fill-opacity="0.2" stroke="#7FB6FF" stroke-opacity="0.6"/>
    <text x="366" y="373" text-anchor="middle">Scale · Parallax</text>
    <rect x="84" y="400" width="109" height="42" rx="21" fill="#5CF2B8" fill-opacity="0.18" stroke="#5CF2B8" stroke-opacity="0.6"/>
    <text x="138" y="427" text-anchor="middle">Stacked</text>
    <rect x="205" y="400" width="170" height="42" rx="21" fill="#B79CFF" fill-opacity="0.2" stroke="#B79CFF" stroke-opacity="0.6"/>
    <text x="290" y="427" text-anchor="middle">Infinite loop</text>
    <rect x="387" y="400" width="150" height="42" rx="21" fill="#FFC36B" fill-opacity="0.2" stroke="#FFC36B" stroke-opacity="0.6"/>
    <text x="462" y="427" text-anchor="middle">Auto scroll</text>
    <rect x="84" y="454" width="191" height="42" rx="21" fill="#FF8DB8" fill-opacity="0.2" stroke="#FF8DB8" stroke-opacity="0.6"/>
    <text x="179" y="481" text-anchor="middle">Page indicators</text>
    <rect x="287" y="454" width="211" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.6"/>
    <text x="392" y="481" text-anchor="middle">tvOS focus paging</text>
  </g>

  <!-- Apple TV screen behind -->
  <g opacity="0.9" transform="translate(30 -6)">
    <rect x="626" y="70" width="600" height="350" rx="20" fill="#0B0A1C" stroke="#4A4378" stroke-width="3"/>
    <rect x="700" y="420" width="452" height="10" rx="5" fill="#3A3366"/>
    <rect x="652" y="128" width="70" height="210" rx="16" fill="url(#c3)" opacity="0.6"/>
    <rect x="1130" y="128" width="70" height="210" rx="16" fill="url(#c4)" opacity="0.6"/>
    <g opacity="0.85"><rect x="750" y="112" width="352" height="242" rx="18" fill="url(#c2)"/>
    <path d="M 750 290 L 830 210 L 880 250 L 960 170 L 1040 245 L 1102 200 L 1102 336 Q 1102 354 1084 354 L 768 354 Q 750 354 750 336 Z" fill="#22385F"/>
    <path d="M 960 170 L 940 192 L 960 186 L 982 192 Z" fill="#FFFFFF"/></g>
    <g fill="#FFFFFF"><rect x="890" y="378" width="30" height="9" rx="4.5"/><circle cx="936" cy="382.5" r="4.5" opacity="0.4"/><circle cx="952" cy="382.5" r="4.5" opacity="0.4"/><circle cx="874" cy="382.5" r="4.5" opacity="0.4"/></g>
  </g>

  <!-- iPhone in front -->
  <g transform="translate(-84 44) scale(0.9)">
  <rect x="780" y="86" width="296" height="520" rx="48" fill="#000" opacity="0.5" filter="url(#soft)" transform="translate(0 14)"/>
  <rect x="778" y="84" width="300" height="524" rx="50" fill="#0D0C1A" stroke="#5A5390" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="790" y="96" width="276" height="500" fill="#100E22"/>
    <rect x="884" y="110" width="88" height="24" rx="12" fill="#000"/>
    <!-- neighbors, scaled and dimmed -->
    <rect x="740" y="190" width="66" height="290" rx="20" fill="url(#c3)" opacity="0.65"/>
    <rect x="1050" y="190" width="66" height="290" rx="20" fill="url(#c2)" opacity="0.65"/>
    <!-- centered card -->
    <rect x="822" y="168" width="212" height="334" rx="24" fill="url(#c1)"/>
    <circle cx="928" cy="352" r="44" fill="#FFF1C9" opacity="0.95"/>
    <rect x="822" y="376" width="212" height="126" fill="#21C2C9" opacity="0"/>
    <rect x="892" y="398" width="72" height="5" rx="2.5" fill="#FFE3A3" opacity="0.8"/>
    <rect x="902" y="412" width="52" height="5" rx="2.5" fill="#FFE3A3" opacity="0.6"/>
    <rect x="822" y="168" width="212" height="334" rx="24" fill="url(#shade)"/>
    <rect x="842" y="452" width="110" height="12" rx="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="842" y="472" width="150" height="8" rx="4" fill="#FFFFFF" opacity="0.55"/>
    <!-- page dots -->
    <g fill="#FF8C7A">
      <circle cx="886" cy="530" r="4.5" opacity="0.35"/><circle cx="900" cy="530" r="4.5" opacity="0.35"/>
      <rect x="911" y="525.5" width="26" height="9" rx="4.5"/>
      <circle cx="948" cy="530" r="4.5" opacity="0.35"/><circle cx="962" cy="530" r="4.5" opacity="0.35"/><circle cx="976" cy="530" r="3" opacity="0.3"/>
    </g>
    <rect x="852" y="556" width="152" height="16" rx="8" fill="#FFFFFF" opacity="0.08"/>
  </g>

  </g>

  <!-- swipe hint -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M 1060 470 L 1150 470"/><path d="M 1136 458 L 1150 470 L 1136 482"/>
  </g>
</svg>
