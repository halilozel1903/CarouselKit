name: CarouselKitDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
packages:
  CarouselKit:
    path: ..
targets:
  WanderTV:
    type: application
    platform: tvOS
    sources:
      - Shared
      - TV
    dependencies:
      - package: CarouselKit
        product: CarouselKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.WanderTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wander
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # Shared/Art.xcassets holds only the demo art. A tvOS icon needs a layered App Icon & Top
        # Shelf brand assets set, which a demo does not need, so the app builds without an icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "3"
  WanderPhone:
    type: application
    platform: iOS
    sources:
      - Shared
      - Phone
    dependencies:
      - package: CarouselKit
        product: CarouselKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.WanderPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wander
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  WanderTV:
    build:
      targets:
        WanderTV: all
    run:
      config: Debug
  WanderPhone:
    build:
      targets:
        WanderPhone: all
    run:
      config: Debug
